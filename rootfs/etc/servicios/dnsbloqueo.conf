# /etc/servicios/dnsbloqueo.conf - el servidor DNS con el bloqueo de publicidad
# (D218): el «Pi-hole» de la casa. Contesta en el puerto UDP 53 a los demás
# equipos de la red local, con el mismo filtro que el resolvedor del kernel, y
# reenvía el resto al DNS del DHCP.
#
# Desactivado: para usarlo, primero «bloqueo activar» (sin él, reenvía todo);
# después «servicio activar dnsbloqueo» para que arranque solo, o «servicio
# iniciar dnsbloqueo» para arrancarlo ahora. Sin el gestor de servicios se
# puede lanzar a mano: dnsbloqueo &
# En el router, poner la IP del SaguiOS como DNS del DHCP de la casa.
nombre=dnsbloqueo
descripcion=Servidor DNS con el bloqueo de publicidad y rastreo (puerto 53)
comando=/bin/dnsbloqueo
usuario=servicio
arrancar=no
reiniciar=fallo
espera=red,/home
