# /etc/servicios/vncd.conf - servidor de escritorio remoto VNC (mejora 097, D252): ver y
# manejar la pantalla de SaguiOS desde el PC con un cliente VNC (TightVNC, TigerVNC...).
#
# DESACTIVADO de serie. Para usarlo:
#   1. «vncd --clave CONTRASEÑA» (hasta 8 caracteres);
#   2. «servicio activar vncd» para que arranque solo, o «servicio iniciar vncd» ahora;
#   3. por defecto solo escucha a la propia máquina (127.0.0.1): desde el PC,
#      ssh -L 5900:localhost:5900 root@IP   y el cliente VNC a localhost:5900.
# Opciones (puerto, red local, solo ver...) en /etc/vnc/vncd.conf. Ver docs/vnc.md.
nombre=vncd
descripcion=Escritorio remoto VNC (puerto 5900, solo desde esta máquina)
comando=/bin/vncd
usuario=root
arrancar=no
reiniciar=fallo
espera=red
