# /etc/servicios/reparar-arranque.conf - reparación automática segura al arrancar (D397).
# Si el kernel montó de solo lectura un ext2 («no se desmontó bien», p. ej. /home tras un cuelgue),
# «reparar --arranque» lo repara con el modo -p (solo arreglos que no pierden datos), lo vuelve a
# montar con escritura y avisa. Si hace falta algo arriesgado, no toca nada: queda de solo lectura y
# el aviso dice «ejecuta reparar hdaN». Para apagarlo: «servicio desactivar reparar-arranque» o crear
# /sistema/conf/reparar-arranque.no.
nombre=reparar-arranque
descripcion=Arranque: repara los ext2 que quedaron en solo lectura por un apagado brusco
comando=/bin/reparar --arranque
usuario=root
arrancar=si
reiniciar=no
