# /etc/servicios/sshd.conf - servidor SSH de administración (D250): para entrar
# desde el PC (ssh, scp, sftp de OpenSSH) por la red local y depurar.
#
# DESACTIVADO de serie. Para usarlo:
#   1. poner la clave pública del PC (~/.ssh/id_ed25519.pub, una línea) en
#      /home/.ssh/authorized_keys (solo ssh-ed25519; no hay contraseñas);
#   2. «servicio activar sshd» para que arranque solo, o «servicio iniciar sshd»
#      para arrancarlo ahora;
#   3. desde el PC: ssh root@IP   (la huella del servidor: sshd --huella).
# Opciones (puerto, solo red local...) en /etc/ssh/sshd.conf. Ver docs/ssh.md.
nombre=sshd
descripcion=Servidor SSH de administración (puerto 22, solo clave pública)
comando=/bin/sshd
usuario=root
arrancar=no
reiniciar=fallo
espera=red
