# /etc/servicios/ntp.conf - ejemplo de servicio de una sola vez: pone el reloj
# en hora al arrancar y termina (reiniciar=no). Para hacerlo cada día, mejor
# una línea "@daily ntp" en crontab -e.
nombre=ntp
descripcion=Pone el reloj en hora por la red (SNTP)
comando=/bin/ntp
usuario=root
arrancar=no
reiniciar=no
espera=red
