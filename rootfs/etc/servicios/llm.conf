# /etc/servicios/llm.conf - la IA local (D380, mejora 139): al arrancar comprueba si este
# equipo puede ejecutar un modelo de lenguaje propio (más de 1,8 GB de RAM y un .gguf en
# /home/compartido/modelos o ~/modelos; los modelos nunca van dentro del sistema) y, si puede, pone el logo «IA Powered» abajo a la izquierda del escritorio.
# Solo comprueba y termina: no carga el modelo ni ocupa memoria. Para no anunciarlo:
# «servicio desactivar llm». El servidor local compatible con OpenAI es «llm --servidor».
nombre=llm
descripcion=IA local: anuncia en el escritorio si el equipo puede ejecutar un modelo
comando=/apps/bin/llm --anunciar
usuario=sagui
arrancar=si
reiniciar=no
espera=/apps,/home
