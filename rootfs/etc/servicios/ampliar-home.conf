# /etc/servicios/ampliar-home.conf - primer arranque (D318): si el disco de arranque tiene
# al menos 512 MB libres que SaguiOS no usa (una imagen grabada en un pendrive o disco
# mayor que ella), pregunta una vez si se amplía /home para usarlos. «No volver a
# preguntar» lo recuerda en SAGUI-CONF. A mano: «ampliar-home --ventana» o, en el
# terminal, «particiones ampliar /home». Para que no pregunte nunca:
# «servicio desactivar ampliar-home».
nombre=ampliar-home
descripcion=Primer arranque: ofrece ampliar /home al espacio libre del disco
comando=/bin/ampliar-home --primer-arranque
usuario=root
arrancar=si
reiniciar=no
