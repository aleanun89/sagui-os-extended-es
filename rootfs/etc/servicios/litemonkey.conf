# /etc/servicios/litemonkey.conf - ejemplo: la base de datos lite-monkey en el
# puerto 7979 (D117). Desactivado: "servicio activar litemonkey" para que
# arranque solo, o "servicio iniciar litemonkey" para arrancarlo ahora.
nombre=litemonkey
descripcion=Base de datos lite-monkey (puerto 7979)
comando=/bin/litemonkey --datos /home/litemonkey
usuario=servicio
arrancar=no
reiniciar=fallo
espera=red,/home
