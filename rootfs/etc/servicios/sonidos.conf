# /etc/servicios/sonidos.conf - los sonidos del sistema (D421): toca el de arranque (si la persona lo activó en
# Configuración > Sonido) y vigila la conexión y desconexión de USB y la batería baja. Con los sonidos
# desactivados (lo de serie) solo mira cada 2 s su archivo de configuración y no hace ruido ni gasta nada.
# Sin tarjeta de sonido no hace nada. Para quitarlo del todo: «servicio desactivar sonidos».
nombre=sonidos
descripcion=Sonidos del sistema: arranque, USB y batería baja
comando=/bin/sonidos --vigilar --arranque
usuario=sagui
arrancar=si
reiniciar=fallo
espera=/home
