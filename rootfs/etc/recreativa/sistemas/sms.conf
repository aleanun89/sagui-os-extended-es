# Sega Master System (y SG-1000) con Gearsystem (D321, GPL-3.0). NTSC 60 Hz, PAL 50 Hz según la ROM.
nombre=Master System
orden=30
extensiones=sms,sg
carpetas=/home/juegos/sms,/jogos/sms
icono=jogo
frecuencia=60

[emulador gearsystem]
nombre=Gearsystem
binario=/apps/bin/gearsystem
args={rom}
args_completa=--pantalla-completa {rom}
predeterminado=si
