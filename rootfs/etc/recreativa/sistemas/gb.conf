# Game Boy con mGBA (D322; formato de docs/recreativa.md, D321). mGBA no necesita BIOS: las ROM
# las pone quien usa el sistema (nunca van a git ni a las imagenes publicadas).
nombre=Game Boy
orden=40
extensiones=gb
carpetas=/home/juegos/gb,/jogos/gb
icono=gb
frecuencia=60

[emulador mgba]
nombre=mGBA
binario=/apps/bin/mgba
args={rom}
args_completa=--pantalla-completa {rom}
predeterminado=si
prioridad=10
