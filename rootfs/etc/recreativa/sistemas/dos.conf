# DOS con DOSBox (D294, D321). Los juegos se guardan en /home/dos/juegos.conf (propiedades de DOSBox por
# juego: núcleo, ciclos, sonido, CD...) y se buscan solos las carpetas de /home/dos y /jogos con un .exe, .com
# o .bat en su raíz: eso lo hace Recreativa por dentro (tipo=dosbox), no hacen falta extensiones ni carpetas aquí.
nombre=DOS
orden=10
icono=jogo

[emulador dosbox]
nombre=DOSBox
binario=/apps/bin/dosbox
tipo=dosbox
predeterminado=si
