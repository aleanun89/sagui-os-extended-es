# /etc/vnc/vncd.conf - opciones del servidor VNC (mejora 097, D252).
# Lo cambia el administrador («admin vncd --ajustar clave=valor»; se guarda en SAGUI-CONF). De
# /home/.config/vncd.conf solo vale fps_max (D371), salvo en vivo (sin SAGUI-CONF), donde gana entero.
# Tras cambiar algo: servicio reiniciar vncd. La contraseña no va aquí: «admin vncd --clave».
#
# Estos son los valores de serie:

# Puerto TCP en el que escucha.
puerto=5900

# local: solo conexiones desde esta máquina (127.0.0.1), para entrar por un túnel
#        ssh -L 5900:localhost:5900 root@IP (lo recomendable);
# red-local: también las direcciones de la red local (10.x, 172.16-31.x, 192.168.x...).
escuchar=local

# si: el cliente ve la pantalla pero no puede teclear ni usar el ratón.
solo_ver=no

# Clientes a la vez (1-4).
max_clientes=2

# Tras «bloqueo_fallos» conexiones seguidas con contraseña mala, esa dirección se
# ignora «bloqueo_segundos» segundos (0 = no bloquear).
bloqueo_fallos=3
bloqueo_segundos=60

# Actualizaciones de pantalla por segundo como mucho (1-30).
fps_max=12

# si: muestra un aviso en pantalla cuando entra un cliente.
aviso=si

# seguridad=ninguna: SIN contraseña (cualquiera que llegue al puerto maneja el equipo).
# No se recomienda; solo para pruebas.
# seguridad=clave
