# /etc/ssh/sshd.conf - opciones del servidor SSH de administración (D250).
# Lo que se ponga en /home/.ssh/sshd.conf gana (y sobrevive a los reinicios si
# /home es persistente). Tras cambiar algo: servicio reiniciar sshd.
#
# Estos son los valores de serie:

# Puerto TCP en el que escucha.
puerto=22

# si: solo atiende a direcciones de la red local (10.x, 172.16-31.x, 192.168.x,
# 169.254.x y la subred de la tarjeta). no: a cualquiera (no se recomienda).
solo_red_local=si

# Sesiones a la vez (1-8) e intentos de autenticación por conexión.
max_conexiones=4
max_intentos=6

# Segundos que tiene un cliente para autenticarse.
tiempo_entrada=60

# Tras «bloqueo_fallos» conexiones seguidas sin autenticarse, esa dirección se
# ignora «bloqueo_segundos» segundos (0 = no bloquear).
bloqueo_fallos=5
bloqueo_segundos=120

# si: la salida de las órdenes sin terminal (ssh IP 'orden') se convierte de
# Latin-1 a UTF-8, para leer bien los acentos en el PC. Estropea la salida
# binaria (ssh IP 'cat archivo' > copia): para archivos, usar scp o sftp.
exec_utf8=no

# Túneles (ssh -L PUERTO:localhost:PUERTO, D253), para entrar cifrado a un
# servicio que solo escucha en esta máquina (el VNC):
#   local      solo hacia esta máquina (localhost, 127.x)
#   red-local  también hacia direcciones de la red local (escritas con números)
#   no         sin túneles
redirigir=local
