<!doctype html>
<html><head><meta charset="utf-8"><title>C1 css</title>
<style>
body{margin:0;font:12px sans-serif;background:#fff}
#o{position:absolute;left:0;top:0;width:8px;height:8px;background:#f0f}
.b{position:absolute;left:10px;width:200px;height:20px;background:#fff}
#d1{top:10px;border-top:4px dashed #f00}
#d2{top:60px;border-top:2px dotted #f00}
#d3{top:110px;border-top:6px double #f00}
.cont{position:absolute;left:10px;top:160px;width:300px;background:#ccc;
  .a{display:block;height:20px;width:100px;background:#f00}
  &.on .b2{display:block;height:20px;width:100px;background:#008000}
  @media (min-width: 100px) { .c{display:block;height:20px;width:100px;background:#ff0} }
  .no{display:none}
}
.cm{position:absolute;top:240px;width:60px;height:20px}
#cm1{left:10px;background:color-mix(in srgb, #f00 50%, #00f 50%)}
#cm2{left:80px;background:oklch(0.628 0.2577 29.23)}
#cm3{left:150px;background:oklch(0.452 0.313 264.05)}
#cm4{left:220px;background:light-dark(#080, #f00)}
#cm5{left:290px;background:oklab(0.628 0.2249 0.1258)}
#cm6{left:360px;background:color-mix(in srgb, #00f 25%, #ff0)}
</style></head><body><div id="o"></div>
<div class="b" id="d1"></div><div class="b" id="d2"></div><div class="b" id="d3"></div>
<div class="cont on"><div class="a"></div><div class="b2"></div><div class="c"></div><div class="no"></div></div>
<div class="cm" id="cm1"></div><div class="cm" id="cm2"></div><div class="cm" id="cm3"></div><div class="cm" id="cm4"></div><div class="cm" id="cm5"></div><div class="cm" id="cm6"></div>
</body></html>
