[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litemonkey"
version = "1.0"
description = "Cliente Python de lite-monkey, la base de datos documental de SaguiOS (API parecida a pymongo)"
requires-python = ">=3.8"

[project.scripts]
lmk = "litemonkey.lmk:principal"

[tool.setuptools]
packages = ["litemonkey"]
