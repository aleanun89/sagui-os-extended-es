# valkey.conf de SaguiOS (D477). Es una configuración corta: para todas las opciones, mira el valkey.conf
# completo de https://github.com/valkey-io/valkey (aquí van solo las que importan en SaguiOS).
#
#   valkey-server /apps/valkey/valkey.conf
#
# En el equipo (127.0.0.1). Para que lo vea otro equipo, pon «bind 0.0.0.0» y una contraseña (requirepass).
bind 127.0.0.1
port 6379
protected-mode yes
# Sin segundo plano: el servicio o la sesión lo lanzan; el registro sale por la terminal
daemonize no
logfile ""
loglevel notice
# El descriptor máximo de SaguiOS por proceso es 128: unos 90 clientes (Valkey se reserva 32 descriptores)
maxclients 90
# Persistencia: instantáneas RDB (fork) en /home; sin AOF por defecto
dir /home
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
appendonly no
appendfilename "appendonly.aof"
# Sin hilos de entrada y salida (SaguiOS no tiene almacenamiento local de hilo; 1 es el único valor admitido)
io-threads 1
# Memoria: SaguiOS es de 32 bits (4 GB de espacio por proceso, menos lo del sistema)
maxmemory 256mb
maxmemory-policy noeviction
