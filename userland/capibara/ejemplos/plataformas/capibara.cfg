# Proyecto de ejemplo de Capibara: plataformas 2D (gráficos de Kenney, CC0; ver CREDITOS.txt).
[proyecto]
nombre = "Capibara: plataformas"
escena_principal = "escenas/nivel1.esc"
semilla = 11

[pantalla]
ancho = 320
alto = 180
escala_entera = no
fondo = "#5fb4ee"

[fisica]
gravedad = 900
paso = 60

# acciones: tecla:Nombre (nombres de la SDL: Left, Space, A...), mando:boton, eje:leftx- / eje:leftx+, raton:izq
[acciones]
izquierda = tecla:Left tecla:A mando:izquierda eje:leftx-
derecha = tecla:Right tecla:D mando:derecha eje:leftx+
saltar = tecla:Space tecla:Up tecla:W mando:a
