# Proyecto de ejemplo de Capibara: disparos con vista cenital (gráficos de Kenney, CC0; ver CREDITOS.txt).
[proyecto]
nombre = "Capibara: escuadron"
escena_principal = "escenas/partida.esc"
semilla = 5

[pantalla]
ancho = 240
alto = 320
escala_entera = no
fondo = "#2a8fd0"

[fisica]
gravedad = 0
paso = 60

[acciones]
izquierda = tecla:Left tecla:A mando:izquierda eje:leftx-
derecha = tecla:Right tecla:D mando:derecha eje:leftx+
arriba = tecla:Up tecla:W mando:arriba eje:lefty-
abajo = tecla:Down tecla:S mando:abajo eje:lefty+
disparar = tecla:Space tecla:Z mando:a raton:izq
