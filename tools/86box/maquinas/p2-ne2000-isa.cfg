; Máquina p2-ne2000-isa (D329): como p2-voodoo3 (Pentium II 350, ASUS P2B-LS i440BX, 128 MB, Voodoo3 AGP, SB16)
; pero pensada para probar el driver de red con NE2000 ISA (0x300, IRQ 10 por defecto de 86Box).
; Plantilla: tools/86box.sh sustituye @IMAGEN@, @PISTAS@, @SERIE@ y @CAPTURAS@.
; Sin ROM (viven en ~/.local/saguitools/86box/roms).

[Machine]
machine = p2bls
cpu_family = pentium2_deschutes
cpu_speed = 350000000
cpu_multi = 3.5
fpu_type = internal
mem_size = 131072
cpu_use_dynarec = 1

[Video]
gfxcard = voodoo3_2k_agp

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2k
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
