; Máquina de referencia k6-3-sis5591 (D301), pedida por el mantenedor: Super Socket 7 de 1998, Gigabyte
; GA-5SG100 (SiS 5591: puente norte con AGP e IDE SiS 5513), AMD K6-III+ a 366 MHz (66 x 5,5; MMX y
; 3DNow!, sin SSE), 128 MB, 3dfx Voodoo3 2000 AGP, Sound Blaster 16 y Realtek RTL8139C+ (driver rtl8139).
; Para ver qué soporta SaguiOS en un chipset que no es Intel (IDE, USB y ACPI de SiS) y en una CPU AMD.
; Plantilla: tools/86box.sh sustituye @IMAGEN@, @PISTAS@, @SERIE@ y @CAPTURAS@.
; Sin ROM (viven en ~/.local/saguitools/86box/roms y NO SE SUBEN NUNCA).

; Sin ROM (viven en ~/.local/saguitools/86box/roms y NO SE SUBEN NUNCA).


[Machine]
machine = 5sg100
cpu_family = k6_3p
cpu_speed = 366666666
cpu_multi = 5.5
fpu_type = internal
mem_size = 131072
cpu_use_dynarec = 1

[Video]
gfxcard = voodoo3_2k_agp

[Sound]
sndcard = sb16

[Network]
net_01_card = rtl8139c+
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
