; SPDX-License-Identifier: GPL-2.0-or-later
; Máquina de referencia p2-voodoo3 (D301): Pentium II a 350 MHz (Deschutes), placa ASUS P2B-LS
; con i440BX (IDE PIIX4), 128 MB, 3dfx Voodoo3 2000 en el AGP, Sound Blaster 16 y NE2000 PCI
; (RTL8029). Plantilla: tools/86box.sh sustituye @IMAGEN@, @PISTAS@, @SERIE@ y @CAPTURAS@.
; Sin ROM (viven en ~/.local/saguitools/86box/roms). 86Box 6.0 no tiene 3Com 3c905
; (solo 3c501/3c503 ISA): se usa NE2000.

[Machine]
machine = p2bls
cpu_family = pentium2_deschutes
cpu_speed = 350000000
cpu_multi = 3.5
fpu_type = internal
mem_size = 131072
cpu_use_dynarec = 1

[Video]
gfxcard = voodoo3_2k_agp

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2kpci
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
