; Máquina p2-s3trio64-vbe12 (D331): la p2-s3trio64 con la S3 Trio64 PCI (86C764, 5333:8811) y su BIOS VBE 1.2,
; sin modos lineales (issue #40): la etapa 2 elige un modo de 16 bits con bancos y abre la ventana
; lineal del chip (CR58-CR5A).
; Plantilla: tools/86box.sh sustituye @IMAGEN@, @PISTAS@, @SERIE@ y @CAPTURAS@. Sin ROM (en ~/.local/saguitools).

[Machine]
machine = p2bls
cpu_family = pentium2_deschutes
cpu_speed = 350000000
cpu_multi = 3.5
fpu_type = internal
mem_size = 131072
cpu_use_dynarec = 1

[Video]
gfxcard = s3_trio64_pci

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2kpci
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
