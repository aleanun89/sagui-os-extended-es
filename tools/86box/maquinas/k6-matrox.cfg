; Máquina de referencia k6-matrox (D301): AMD K6-2 a 350 MHz (bus 100) en una AOpen AX59 Pro
; (Super 7, VIA MVP3, IDE con UDMA), 128 MB, Matrox Mystique 220 PCI, Sound Blaster 16 y NE2000 PCI.
; Plantilla: ver p2-voodoo3.cfg. Sin ROM.

[Machine]
machine = ax59pro
cpu_family = k6_2
cpu_speed = 350000000
cpu_multi = 3.5
fpu_type = internal
mem_size = 131072
cpu_use_dynarec = 1

[Video]
gfxcard = mystique_220

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2kpci
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
