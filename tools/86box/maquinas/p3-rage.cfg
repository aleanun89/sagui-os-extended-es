; Máquina de referencia p3-rage (D301): placa de Pentium III (ASUS P3B-F, i440BX, Slot 1) con un
; Pentium II Deschutes a 450 MHz, 256 MB, ATI Mach64 VT2 (Rage II, PCI), Ensoniq ES1371 y NE2000 PCI.
; 86Box 6.0 NO emula Pentium III (Katmai/Coppermine, sin SSE) ni ATI Rage 128 / Rage Pro: esta
; es la mezcla más cercana. Plantilla: ver p2-voodoo3.cfg. Sin ROM.

[Machine]
machine = p3bf
cpu_family = pentium2_deschutes
cpu_speed = 450000000
cpu_multi = 4.5
fpu_type = internal
mem_size = 262144
cpu_use_dynarec = 1

[Video]
gfxcard = mach64vt2

[Sound]
sndcard = es1371

[Network]
net_01_card = ne2kpci
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
