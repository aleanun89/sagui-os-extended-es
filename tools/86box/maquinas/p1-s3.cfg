; Máquina de referencia p1-s3 (D301), el límite inferior: Pentium MMX a 200 MHz, placa ASUS
; P/I-P55T2P4 (i430HX, IDE PIIX3 sin ACPI), 64 MB, S3 Trio64 PCI, Sound Blaster 16 ISA y NE2000
; ISA. Plantilla: ver p2-voodoo3.cfg. Sin ROM.

[Machine]
machine = p55t2p4
cpu_family = pentium_p55c
cpu_speed = 200000000
cpu_multi = 3
fpu_type = internal
mem_size = 65536
cpu_use_dynarec = 1

[Video]
gfxcard = s3_trio64_pci

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2k
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
