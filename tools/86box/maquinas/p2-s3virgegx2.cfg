; Máquina p2-s3virgegx2 (D308): la ASUS P2B-LS de p2-voodoo3 (Pentium II 350, i440BX, 128 MB, SB16,
; NE2000 PCI) con una S3 ViRGE/GX2 AGP (86C357, 5333:8A10) y una 3dfx Voodoo (121a:0001) como segunda tarjeta
; BIOS única (TRIO3D2X_8mbsdr.VBI).
; Para el 2D por la GPU (acel_s3.c, motor ViRGE).
; Plantilla: tools/86box.sh sustituye @IMAGEN@, @PISTAS@, @SERIE@ y @CAPTURAS@. Sin ROM (en ~/.local/saguitools).

[Machine]
machine = p2bls
cpu_family = pentium2_deschutes
cpu_speed = 350000000
cpu_multi = 3.5
fpu_type = internal
mem_size = 131072
cpu_use_dynarec = 1

[Video]
gfxcard = virge_gx2_agp
voodoo = 1

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2kpci
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2

