; Máquina p2-mach64 (D308): la ASUS P2B-LS de p2-voodoo3 (Pentium II 350, i440BX, 128 MB, SB16,
; NE2000 PCI) con una ATI Mach64 VT2 PCI (264VT2, 1002:5654, «Rage II» de la época sin 3D completo): la Mach64
; más alta que trae 86Box 6.0 (no tiene Rage Pro ni Rage 128). Para el 2D por la GPU (acel_mach64.c).
; Plantilla: tools/86box.sh sustituye @IMAGEN@, @PISTAS@, @SERIE@ y @CAPTURAS@. Sin ROM (en ~/.local/saguitools).

[Machine]
machine = p2bls
cpu_family = pentium2_deschutes
cpu_speed = 350000000
cpu_multi = 3.5
fpu_type = internal
mem_size = 131072
cpu_use_dynarec = 1

[Video]
gfxcard = mach64vt2

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2kpci
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
