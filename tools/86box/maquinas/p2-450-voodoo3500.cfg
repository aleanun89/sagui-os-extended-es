; SPDX-License-Identifier: GPL-2.0-or-later
; Máquina de referencia p2-450-voodoo3500 (D301), la gama media-alta de 1999: Pentium II a 450 MHz
; (Deschutes, bus de 100 MHz) en una ASUS P2B-LS (i440BX, IDE PIIX4), 256 MB, 3dfx Voodoo3 3500 AGP
; (16 MB, la más alta de las Voodoo3), Sound Blaster 16 y Realtek RTL8139C+ (driver rtl8139 de SaguiOS).
; 86Box 6.0 no emula el Pentium III (ni SSE): es lo más cercano en la misma placa que ya arranca
; (p2-voodoo3). Plantilla: tools/86box.sh sustituye @IMAGEN@, @PISTAS@, @SERIE@ y @CAPTURAS@.
; Sin ROM (viven en ~/.local/saguitools/86box/roms y NO SE SUBEN NUNCA).


[Machine]
machine = p2bls
cpu_family = pentium2_deschutes
cpu_speed = 450000000
cpu_multi = 4.5
fpu_type = internal
mem_size = 262144
cpu_use_dynarec = 1

[Video]
gfxcard = voodoo3_3500_agp

[Sound]
sndcard = sb16

[Network]
net_01_card = rtl8139c+
net_01_net_type = slirp

[General]
vid_renderer = qt_software
window_remember = 0
vid_resize = 0

[Hard disks]
hdd_01_parameters = 63, 16, @PISTAS@, 0, ide
hdd_01_fn = @IMAGEN@
hdd_01_ide_channel = 0:0

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = serial_passthrough

; COM1 va a un pty del anfitrión (tests/emu86box.py lo crea y lo vuelca a serie.txt)
[Serial Passthrough (COM) #1]
path = @SERIE@

[Input devices]
mouse_type = ps2
